# Databricks Asset Bundle Configuration
# Deploy with: databricks bundle deploy -t dev
bundle:
  name: ai-data-analyst-demo

variables:
  genie_space_id:
    description: "The Genie Space ID for data analysis"
    default: ""  # Set via: databricks bundle deploy --var genie_space_id=YOUR_ID
  warehouse_id:
    description: "SQL Warehouse ID"
    default: ""  # Set via: databricks bundle deploy --var warehouse_id=YOUR_ID
  model_endpoint:
    description: "The model serving endpoint for ChatDatabricks"
    default: "databricks-meta-llama-3-3-70b-instruct"
  mock_mode:
    description: "Enable mock mode for demos without real Genie access"
    default: "false"
  vector_search_endpoint:
    description: "Vector Search endpoint name for RAG"
    default: "rag-demo-endpoint"
  vector_search_index:
    description: "Vector Search index name (catalog.schema.index)"
    default: "workspace.rag_demo.document_index"

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/ai-data-analyst-demo

sync:
  include:
    - src/**
    - notebooks/**

resources:
  jobs:
    demo_setup:
      name: "AI Data Analyst - Demo Setup"
      tasks:
        - task_key: run_demo
          notebook_task:
            notebook_path: notebooks/01_agent_basics.ipynb
            base_parameters:
              genie_space_id: ${var.genie_space_id}
              model_endpoint: ${var.model_endpoint}
              mock_mode: ${var.mock_mode}
            warehouse_id: ${var.warehouse_id}

targets:
  dev:
    mode: development
    default: true
    # Set workspace host via DATABRICKS_HOST env var or databricks CLI profile
    variables:
      mock_mode: "false"  # Using real Genie

  prod:
    mode: production
    # Set workspace host via DATABRICKS_HOST env var or databricks CLI profile
    variables:
      mock_mode: "false"
