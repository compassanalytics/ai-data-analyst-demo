name: Release Workshop Materials

on:
  push:
    tags:
      - 'workshop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/workshop-}" >> $GITHUB_OUTPUT
          fi

      - name: Create workshop bundle
        run: |
          mkdir -p workshop-bundle

          # --- Full directory copies ---
          cp -r src workshop-bundle/
          cp -r notebooks workshop-bundle/
          cp -r config workshop-bundle/
          cp -r infra workshop-bundle/

          # --- Remove download-only notebook (not needed in bundle) ---
          # (no exclusions needed — 00a_setup_download was removed from source)

          # --- Data: only RAG documents ---
          if [ -d data/documents ]; then
            mkdir -p workshop-bundle/data
            cp -r data/documents workshop-bundle/data/
          fi

          # --- Docs: only workshop-essential docs ---
          mkdir -p workshop-bundle/docs
          for doc in SETUP.md TROUBLESHOOTING.md GENIE_BEST_PRACTICES.md README.md ARCHITECTURE.md; do
            [ -f "docs/$doc" ] && cp "docs/$doc" workshop-bundle/docs/
          done

          # --- Demo docs: attendee-facing setup, guide, and SDK reference ---
          if [ -d docs/demo ]; then
            cp -r docs/demo workshop-bundle/docs/demo
          fi

          # --- Root files ---
          cp pyproject.toml workshop-bundle/
          cp README.md workshop-bundle/
          cp databricks.yml workshop-bundle/
          cp .env.example workshop-bundle/

          # --- Cleanup Python cache artifacts ---
          find workshop-bundle -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find workshop-bundle -name '*.pyc' -delete 2>/dev/null || true
          find workshop-bundle -name '.DS_Store' -delete 2>/dev/null || true

          # --- Create tarball ---
          tar -czvf workshop-materials-${{ steps.version.outputs.VERSION }}.tar.gz workshop-bundle

      - name: Verify bundle contents
        run: |
          echo "=== Bundle Contents ==="
          tar -tzf workshop-materials-${{ steps.version.outputs.VERSION }}.tar.gz | head -100
          echo ""
          echo "=== Verification ==="
          CONTENTS=$(tar -tzf workshop-materials-${{ steps.version.outputs.VERSION }}.tar.gz)
          PASS=true
          for item in src notebooks config infra data/documents docs docs/demo pyproject.toml README.md databricks.yml .env.example; do
            if echo "$CONTENTS" | grep -q "workshop-bundle/$item"; then
              echo "[OK] $item"
            else
              echo "[MISSING] $item"
              PASS=false
            fi
          done
          for excluded in snippets/ benchmark.py upload_to_azure.py test_planner.py test_multi_genie.py test_synthesizer.py test_report_writer.py; do
            if echo "$CONTENTS" | grep -q "$excluded"; then
              echo "[LEAKED] $excluded found in bundle!"
              PASS=false
            fi
          done
          if [ "$PASS" = false ]; then
            echo "Bundle verification FAILED"
            exit 1
          fi
          echo "Bundle verification PASSED"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: workshop-materials-${{ steps.version.outputs.VERSION }}.tar.gz
          generate_release_notes: true
          tag_name: workshop-${{ steps.version.outputs.VERSION }}
