name: Release Workshop Materials

on:
  push:
    tags:
      - 'workshop-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/workshop-}" >> $GITHUB_OUTPUT
          fi

      - name: Create workshop bundle
        run: |
          mkdir -p workshop-bundle

          # --- Full directory copies ---
          cp -r src workshop-bundle/
          cp -r notebooks workshop-bundle/
          cp -r config workshop-bundle/
          cp -r infra workshop-bundle/

          # --- Remove internal-only files from notebooks/data/ ---
          rm -rf workshop-bundle/notebooks/data/demo_fallbacks

          # --- Remove src modules not used by any notebook ---
          rm -rf workshop-bundle/src/benchmark
          rm -rf workshop-bundle/src/evaluation

          # --- Trim src/demo to only modules used by notebook 02 ---
          # Notebook 02 imports: PipelineStage, PipelineState, render_for_notebook, render_progress_html
          # These live in pipeline.py, visualization.py, and widgets.py (transitive)
          rm -f workshop-bundle/src/demo/challenges.py
          rm -f workshop-bundle/src/demo/checkpoints.py
          rm -f workshop-bundle/src/demo/feedback.py
          rm -f workshop-bundle/src/demo/presenter.py

          # Rewrite src/demo/__init__.py to only export what remains
          cat > workshop-bundle/src/demo/__init__.py << 'INITEOF'
          """Demo utilities for the Jupyter notebooks."""

          from src.demo.pipeline import (
              PipelineStage,
              PipelineState,
              SpaceProgress,
              SpaceQueryStatus,
              StageResult,
          )
          from src.demo.visualization import (
              generate_mermaid_diagram,
              generate_pipeline_diagram_text,
              generate_space_progress_text,
              generate_stage_progress_text,
              generate_timing_table,
              render_for_notebook,
              render_progress_html,
          )
          from src.demo.widgets import (
              DatabricksWidgets,
              LocalWidgets,
              WidgetConfig,
              create_widget_manager,
              get_question_for_report_type,
              is_databricks,
              is_serverless,
          )

          __all__ = [
              "PipelineState",
              "PipelineStage",
              "SpaceQueryStatus",
              "SpaceProgress",
              "StageResult",
              "render_for_notebook",
              "render_progress_html",
              "generate_stage_progress_text",
              "generate_space_progress_text",
              "generate_timing_table",
              "generate_pipeline_diagram_text",
              "generate_mermaid_diagram",
              "WidgetConfig",
              "DatabricksWidgets",
              "LocalWidgets",
              "create_widget_manager",
              "get_question_for_report_type",
              "is_databricks",
              "is_serverless",
          ]
          INITEOF
          # Fix indentation from heredoc
          sed -i 's/^          //' workshop-bundle/src/demo/__init__.py

          # --- Docs: only workshop-essential docs ---
          mkdir -p workshop-bundle/docs
          for doc in SETUP.md TROUBLESHOOTING.md GENIE_BEST_PRACTICES.md README.md ARCHITECTURE.md; do
            [ -f "docs/$doc" ] && cp "docs/$doc" workshop-bundle/docs/
          done

          # --- Demo docs: attendee-facing setup, guide, and SDK reference ---
          if [ -d docs/demo ]; then
            cp -r docs/demo workshop-bundle/docs/demo
          fi

          # --- Root: only README (no pyproject.toml, databricks.yml, .env.example) ---
          cp README.md workshop-bundle/

          # --- Cleanup Python cache artifacts ---
          find workshop-bundle -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find workshop-bundle -name '*.pyc' -delete 2>/dev/null || true
          find workshop-bundle -name '.DS_Store' -delete 2>/dev/null || true

          # --- Create tarball ---
          tar -czvf workshop-materials-${{ steps.version.outputs.VERSION }}.tar.gz workshop-bundle

      - name: Verify bundle contents
        run: |
          echo "=== Bundle Contents ==="
          tar -tzf workshop-materials-${{ steps.version.outputs.VERSION }}.tar.gz | head -100
          echo ""
          echo "=== Verification ==="
          CONTENTS=$(tar -tzf workshop-materials-${{ steps.version.outputs.VERSION }}.tar.gz)
          PASS=true
          for item in src notebooks config infra docs docs/demo README.md; do
            if echo "$CONTENTS" | grep -q "workshop-bundle/$item"; then
              echo "[OK] $item"
            else
              echo "[MISSING] $item"
              PASS=false
            fi
          done
          for excluded in snippets/ demo_fallbacks/ src/benchmark/ src/evaluation/ challenges.py checkpoints.py feedback.py presenter.py pyproject.toml databricks.yml .env.example; do
            if echo "$CONTENTS" | grep -q "workshop-bundle/$excluded"; then
              echo "[LEAKED] $excluded found in bundle!"
              PASS=false
            fi
          done
          if [ "$PASS" = false ]; then
            echo "Bundle verification FAILED"
            exit 1
          fi
          echo "Bundle verification PASSED"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: workshop-materials-${{ steps.version.outputs.VERSION }}.tar.gz
          generate_release_notes: true
          tag_name: workshop-${{ steps.version.outputs.VERSION }}
