[project]
name = "ai-data-analyst-demo"
version = "0.1.0"
description = "AI Data Analyst Demo: Databricks Genie with LangGraph Multi-Agent Orchestration"
requires-python = ">=3.10"
dependencies = [
    "databricks-sdk>=0.40.0",
    "databricks-langchain>=0.13.0",
    "databricks-vectorsearch>=0.64",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "faker>=28.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel>=6.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
