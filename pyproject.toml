[project]
name = "ai-data-analyst-demo"
version = "0.1.0"
description = "AI Data Analyst Demo: Databricks Genie with LangGraph Multi-Agent Orchestration"
requires-python = ">=3.10"
dependencies = [
    "databricks-sdk>=0.40.0",
    "databricks-langchain>=0.13.0",
    "databricks-vectorsearch>=0.64",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "faker>=28.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "tenacity>=9.1.2",
    "jinja2>=3.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.0.0",
    "azure-storage-blob>=12.28.0",
    "litellm>=1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ipykernel>=6.29.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/templates" = "src/templates"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM102", # nested if statements - sometimes more readable
    "SIM105", # contextlib.suppress - try/except is often clearer
    "SIM108", # ternary operator - multi-line if/else is often more readable
    "B905",   # zip() strict - not needed for most use cases
]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks have dbutils and spark as globals, E722 for dbutils cleanup, E402 imports
# B007/F841: workshop TODO placeholders intentionally leave vars unused for participants to fill in
"notebooks/**" = ["F821", "E722", "E402", "B007", "F841"]
# E402 for path manipulation before imports
"scripts/**" = ["F821", "E402"]
# B023 false positives in closures, F841 unused vars from pattern matching, F601 intentional traps
"dataset_generators/**" = ["B023", "F841", "B007", "F601", "F401", "UP035", "E402"]
"tests/**" = ["B023"]
# Databricks snippet files use spark global, E402 for config before imports
"snippets/**" = ["F821", "E402"]
# SIM103 sometimes more readable
"src/**" = ["SIM103"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Start lenient, tighten over time
warn_return_any = false
warn_unused_ignores = false
check_untyped_defs = false
disallow_untyped_defs = false
# Focus on catching real errors
strict_optional = false
no_implicit_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
