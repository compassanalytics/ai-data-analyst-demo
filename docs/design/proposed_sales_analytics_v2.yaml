# PROPOSED DESIGN - NOT A LIVE CONFIG
# =====================================
# This file documents the target schema for Velocity Motors Sales Analytics
# with Advanced Relationship Patterns. It is NOT a deployed Genie Space config.
#
# Patterns Included:
# 1. Hierarchy (territories)
# 2. Many-to-Many (features/vehicle_features)
# 3. Self-Referential (salespersons.manager_id)
# 4. SCD Type 2 (price_history)
# 5. Denormalized Aggregate (orders.order_total)
#
# See: docs/velocity_motors_erd.md for ERD
# See: docs/velocity_motors_advanced_queries.md for query examples

